build:
  nodes:
    analysis:
      environment:
        php:
          version: '8.2'
      dependencies:
        override:
          - composer install --no-interaction --prefer-dist
      tests:
        override:
          - command: 'vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover build/logs/clover.xml --log-junit build/logs/junit.xml'
            coverage:
              file: 'build/logs/clover.xml'
              format: 'clover'

filter:
  paths:
    - src/*
    - tests/*

checks:
  php:
    code_rating: true
    duplication: true
